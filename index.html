<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link>
    <title>Workout Generator</title>
</head>
<body>
    <h1 id="welcome-screen">WELCOME!</h1>
    <h1>Select your workout intensity:</h1>
    <div class="workoutIntensityButtons">
        <label>
            <input type="radio" name="workoutIntensity" value="low">Low Intensity</input>
        </label>
        <label>
            <input type="radio" name="workoutIntensity" value="medium">Medium Intensity</input>
        </label>
        <label>
            <input type="radio" name="workoutIntensity" value="high">High Intensity</input>
        </label>
    </div>
    <h1>Select up to 3 body section(s)/workout type(s):</h1>
    <div class="bodySections">
        <label>
            <input type="checkbox" name="bodySections" value="upperBody">Upper Body</input>
        </label>
        <label>
            <input type="checkbox" name="bodySections" value="legs">Legs</input>
        </label>
        <label>
            <input type="checkbox" name="bodySections" value="abs">Abs</input>
        </label>
        <label>
            <input type="checkbox" name="bodySections" value="endurance">Endurance/Cardio</input>
        </label>
        <label>
            <input type="checkbox" name="bodySections" value="flexibility">Flexibility</input>
        </label>
    </div>
    <div class="button-container">
    <button onclick="generateWorkout(getSelectedIntensity())" id="generateWorkoutButton">Generate Workout</button> 
    <!-- the function call ^ -->
    </div>
    <div id="para1"></div>
    <script src="index.js"></script>
</body>

</html>
